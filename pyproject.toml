[project]
name = "visaocomputacional"
version = "0.1.0"
description = "Detecção automática de rostos com atrasos de 5 segundos para controlar a lâmpada via Arduino Uno."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "streamlit>=1.51,<2",
    "opencv-contrib-python-headless>=4.12,<5",
    "numpy>=2.2,<3",
    "pillow>=12.3,<13",
    "pyserial>=3.5,<4",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
